apply plugin: 'com.android.application'

// release签名配置从 keystore.properties 读取(直接复用接收端密钥库 hrbubble-release.jks,
// applicationId 不同不影响签名复用, 升级安装只认签名不认包内其他应用)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.hrmlink.hrserver'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.hrmlink.hrserver"
        minSdk 26          // Android 8.1 设备 (AIR1201-D01)
        targetSdk 28       // 与接收端一致: 避免更高版本对前台服务/悬浮窗的额外收紧
        versionCode 2
        versionName "1.0.1"
    }

    // 产物自动命名: HRHub-1.0.0.apk (对齐接收端 HRBubble-*.apk 风格)
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "HRHub-" + variant.versionName.replace(" ", "") + ".apk"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        // 侧载自用, 有意 targetSdk 28, 不上Google Play
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    buildFeatures {
        buildConfig true   // 设置页版本号显示需要 BuildConfig.VERSION_NAME
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // HTTP服务端(对标EXE webpush_server.py: /api/heartrate + /ws 广播)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    // MQTT客户端(对标EXE mqtt_client.py, 含HA发现)
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // HTTP客户端(InfluxDB写入/Bark/ntfy/小爱推送)
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    // 检查更新: FileProvider 共享下载的APK给系统安装器
    implementation 'androidx.core:core:1.8.0'
}
