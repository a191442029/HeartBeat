apply plugin: 'com.android.application'

// release????? keystore.properties ??(??? hrbubble-release.jks ??????)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.hrmlink.hrbubble'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.hrmlink.hrbubble"
        minSdk 26          // Android 8.0 ??
        targetSdk 28       // ??????????/?????????; ???????
        versionCode 10
        versionName "1.2.1"
    }

    // ??????: HRBubble-1.0.0.apk (????? HRHub-*.apk ??)
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "HRBubble-" + variant.versionName.replace(" ", "") + ".apk"
        }
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ?????? keystore.properties ?????(??????debug/???release??)
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        // ????????, ?? targetSdk 28(??8.0?????), ??Google Play
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    buildFeatures {
        buildConfig true   // AGP8????; ?????????? BuildConfig.VERSION_NAME
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // WS??? + HTTP?? ?????; 3.14.9 ?? API 21+
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    // ????: FileProvider ?????APK??????
    implementation 'androidx.core:core:1.8.0'
}
